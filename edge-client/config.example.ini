; SmartClass classroom device settings. Copy to config.ini.

[smartclass]
; Address of the SmartClass server PC on the college network
server_url = http://192.168.1.10

; From the website: Admin → Edge Devices → New key (shown once)
device_key = scdev_PASTE_THE_KEY_HERE

; pn532_i2c (recommended), pn532_spi, or simulate (type UIDs in the terminal)
reader = pn532_i2c

; Where lecture files are kept on the SD card
cache_dir = ~/.smartclass/cache

; Log the faculty out after this many minutes without a touch while nothing is presenting
idle_logout_minutes = 15

; Programs that show the lecture. {file} is replaced with the file path.
pdf_viewer = evince --presentation {file}
pptx_viewer = libreoffice --norestore --show {file}

fullscreen = true
