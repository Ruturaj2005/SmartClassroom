# SmartClass on-premise server.
#
#   1. cp .env.server.example .env   (and set the secrets)
#   2. docker compose up -d --build
#   3. docker compose exec backend npm run seed     (optional demo data)
#
# Faculty open http://<this-PC's-LAN-IP>/ ; classroom Pis use the same address.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartclass
      POSTGRES_USER: smartclass
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartclass -d smartclass"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://smartclass:${POSTGRES_PASSWORD}@db:5432/smartclass?schema=public
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}
      EDGE_TAP_TOKEN_EXPIRES_IN: ${EDGE_TAP_TOKEN_EXPIRES_IN:-3h}
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-52428800}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: "1"
    volumes:
      # All uploaded lecture files live here, on this PC
      - uploads:/data/uploads

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  pgdata:
  uploads:
